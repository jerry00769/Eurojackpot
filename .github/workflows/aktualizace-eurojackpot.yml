
name: Aktualizace historie Eurojackpotu
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 3,6'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/update-history.py
      - name: Commit nových tahů
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eurojackpot.csv
          git diff --cached --quiet || (git commit -m "Aktualizace Eurojackpot losování" && git push)
